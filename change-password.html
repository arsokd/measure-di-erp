<!doctype html>
<html lang="en">
  <head>
    <script src="js/error-monitor.js"></script>
    <script src="js/report-problem.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set Your Password | K-30_ERP</title>
    <link rel="stylesheet" href="/src/index.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/store.js"></script>
    <script src="js/seed-data.js" defer></script>
  </head>
  <body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-800">

      <!-- Top Brand Banner -->
      <div class="bg-slate-900 px-8 py-8 text-center text-white relative border-b border-slate-800">
        <div class="w-14 h-14 rounded-2xl bg-indigo-950/60 text-indigo-300 flex items-center justify-center mx-auto shadow-md mb-3 border border-indigo-800/60">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-xl font-black tracking-wider text-white uppercase">Set Your Password</h1>
        <p class="text-[#E283BD] text-xs font-bold mt-1 tracking-widest uppercase">Required before you continue</p>
      </div>

      <!-- Form Content -->
      <div class="p-8">

        <div id="reason-banner" class="hidden mb-5 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs font-semibold flex items-start space-x-2">
          <svg class="w-4 h-4 text-amber-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="reason-text">For your security, you need to set your own password before you can continue.</span>
        </div>

        <!-- Error Alert -->
        <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-start space-x-2">
          <svg class="w-4 h-4 text-rose-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="error-message">Error message here</span>
        </div>

        <!-- Success Alert -->
        <div id="success-alert" class="hidden mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium flex items-start space-x-2">
          <svg class="w-4 h-4 text-emerald-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Password updated. Taking you in…</span>
        </div>

        <form id="change-password-form" class="space-y-5" onsubmit="handleChangePasswordSubmit(event)">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">New Password</label>
            <div class="relative">
              <input type="password" id="new-password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#982B68] focus:bg-white transition-all pl-10" />
              <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Confirm New Password</label>
            <div class="relative">
              <input type="password" id="confirm-password" required minlength="6" placeholder="Re-enter your new password" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#982B68] focus:bg-white transition-all pl-10" />
              <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full py-3.5 bg-[#982B68] hover:bg-[#822358] text-white font-semibold rounded-xl text-sm shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <span id="btn-text">Set Password & Continue</span>
            <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          </button>
        </form>

      </div>

      <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center space-y-1">
        <p class="text-xs font-semibold text-slate-700">K-30_ERP &bull; Measure DI Technologies &copy; 2026</p>
        <p class="text-[11px] text-slate-500">Developed and maintained by <span class="font-bold text-[#982B68]">Analytics Spire</span></p>
      </div>

    </div>

    <script>
      // Deliberately does NOT call checkAuth()/autoInitGlobalAuthGuard() -
      // this page has no navbar or navigation on purpose, so there's
      // nothing to render and nowhere to click away to. It only needs to
      // confirm a real Firebase session exists; if not, straight to login.
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof auth === 'undefined' || !auth) {
          window.location.href = 'login.html';
          return;
        }
        auth.onAuthStateChanged(function (user) {
          if (!user) {
            window.location.href = 'login.html';
            return;
          }
          showReasonBanner();
        });
      });

      function showReasonBanner() {
        try {
          var employeeId = localStorage.getItem('employeeId');
          var userEmail = localStorage.getItem('userEmail');
          var employees = (window.RevOpsStore && typeof window.RevOpsStore.getCollection === 'function')
            ? (window.RevOpsStore.getCollection('employees') || [])
            : [];
          var emp = employees.find(function (e) { return e && (e.employeeId === employeeId || e.email === userEmail); });
          if (!emp) return;

          var reason = 'For your security, you need to set your own password before you can continue.';
          if (emp.mustChangePassword === true) {
            reason = 'You logged in with a password your Admin set for you — please choose your own password to continue.';
          } else if (emp.passwordLastUpdated) {
            var daysSince = (Date.now() - new Date(emp.passwordLastUpdated).getTime()) / (1000 * 60 * 60 * 24);
            if (daysSince >= 90) {
              reason = 'Your password is more than 90 days old. For security, please set a new one to continue.';
            }
          }
          document.getElementById('reason-text').innerText = reason;
          document.getElementById('reason-banner').classList.remove('hidden');
        } catch (e) {}
      }

      function showError(msg) {
        document.getElementById('success-alert').classList.add('hidden');
        var errDiv = document.getElementById('error-alert');
        document.getElementById('error-message').innerText = msg;
        errDiv.classList.remove('hidden');
      }

      function hideError() {
        document.getElementById('error-alert').classList.add('hidden');
      }

      function setLoading(loading) {
        var btnText = document.getElementById('btn-text');
        var spinner = document.getElementById('btn-spinner');
        var btn = document.getElementById('submit-btn');
        if (loading) {
          btnText.innerText = "Saving...";
          spinner.classList.remove('hidden');
          btn.disabled = true;
        } else {
          btnText.innerText = "Set Password & Continue";
          spinner.classList.add('hidden');
          btn.disabled = false;
        }
      }

      async function handleChangePasswordSubmit(e) {
        e.preventDefault();
        hideError();

        var newPassword = document.getElementById('new-password').value;
        var confirmPassword = document.getElementById('confirm-password').value;

        if (!newPassword || newPassword.length < 6) {
          showError("Password must be at least 6 characters long.");
          return;
        }
        if (newPassword !== confirmPassword) {
          showError("The two passwords you entered don't match.");
          return;
        }

        setLoading(true);

        try {
          var currentUser = auth.currentUser;
          if (!currentUser) {
            showError("Your session has expired. Please sign in again.");
            setLoading(false);
            setTimeout(function () { window.location.href = 'login.html'; }, 1500);
            return;
          }

          var idToken = await currentUser.getIdToken(true);
          var response = await fetch('/.netlify/functions/change-own-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + idToken
            },
            body: JSON.stringify({ newPassword: newPassword })
          });
          var resData = await response.json();

          if (!response.ok || !resData.success) {
            showError(resData.error || "Could not update your password. Please try again.");
            setLoading(false);
            return;
          }

          // Mirror the clear locally too, so the very next page we send
          // the user to doesn't immediately bounce them back here again
          // while waiting for the next Firestore sync tick.
          try {
            var employeeId = localStorage.getItem('employeeId');
            var userEmail = localStorage.getItem('userEmail');
            var employees = window.RevOpsStore.getCollection('employees') || [];
            var emp = employees.find(function (e) { return e && (e.employeeId === employeeId || e.email === userEmail); });
            if (emp) {
              window.RevOpsStore.updateItem('employees', emp.id, {
                mustChangePassword: false,
                passwordLastUpdated: new Date().toISOString()
              });
            }
          } catch (eLocal) {}

          document.getElementById('change-password-form').classList.add('hidden');
          document.getElementById('reason-banner').classList.add('hidden');
          document.getElementById('success-alert').classList.remove('hidden');

          var userRole = localStorage.getItem('userRole');
          setTimeout(function () {
            if (userRole === 'staff') {
              window.location.href = 'my-scorecard.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 1200);
        } catch (err) {
          console.error("Change password error:", err);
          showError("Something went wrong: " + (err.message || "Please try again."));
          setLoading(false);
        }
      }
    </script>
  </body>
</html>
