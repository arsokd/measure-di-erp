name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every JS file
        run: |
          set -e
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./dist/*" -print0 \
            | xargs -0 -n1 node --check
          echo "All JS files parse cleanly."

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8099 &
          sleep 1

      - name: Run smoke tests
        run: node scripts/smoke-test.js http://localhost:8099

      - name: Run regression tests
        run: node scripts/regression-test.js http://localhost:8099
