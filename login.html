<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-30_ERP - Login</title>
    <link rel="stylesheet" href="/src/index.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/store.js"></script>
    <script src="js/seed-data.js" defer></script>
  </head>
  <body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-800">
      
      <!-- Top Brand Banner -->
      <div class="bg-slate-900 px-8 py-8 text-center text-white relative border-b border-slate-800">
        <div class="w-16 h-16 rounded-2xl bg-slate-800 text-white flex items-center justify-center mx-auto shadow-md mb-3 border border-slate-700 p-2" style="width: 64px; height: 64px; max-width: 64px; max-height: 64px; margin: 0 auto 12px auto;">
          <svg style="width: 48px; height: 48px; max-width: 48px; max-height: 48px; display: block;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M45 22C30 22 18 34 18 49C18 64 30 76 45 76C60 76 72 64 72 49V40H56V49C56 55 51 60 45 60C39 60 34 55 34 49C34 43 39 38 45 38H56V22H45Z" fill="#982B68"/>
            <rect x="58" y="12" width="7" height="7" fill="#982B68"/>
            <rect x="67" y="12" width="7" height="7" fill="#982B68"/>
            <rect x="58" y="21" width="7" height="7" fill="#982B68"/>
            <rect x="67" y="21" width="7" height="7" fill="#982B68"/>
            <rect x="67" y="30" width="7" height="7" fill="#982B68"/>
            <rect x="58" y="30" width="7" height="7" fill="#ffffff"/>
          </svg>
        </div>
        <h1 class="text-2xl font-black tracking-wider text-white uppercase">K-30_ERP</h1>
        <p class="text-[#E283BD] text-xs font-bold mt-1 tracking-widest uppercase">ENTERPRISE REVOPS & ERP PLATFORM</p>
      </div>

      <!-- Form Content -->
      <div class="p-8">
        
        <!-- Error Alert -->
        <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-start space-x-2">
          <svg class="w-4 h-4 text-rose-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span id="error-message">Error message here</span>
        </div>

        <form id="login-form" class="space-y-5" onsubmit="handleLoginSubmit(event)">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Mobile Number or Email</label>
            <div class="relative">
              <input type="text" id="login-id" required placeholder="9840629928 or ars.okd@gmail.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#982B68] focus:bg-white transition-all pl-10 font-medium" />
              <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            </div>
            <p class="text-[11px] text-slate-500 mt-1">💡 Login using your 10-digit Mobile Number or Gmail ID</p>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
              <button type="button" onclick="handleForgotPassword()" class="text-xs font-medium text-[#982B68] hover:underline transition-colors">Forgot password?</button>
            </div>
            <div class="relative">
              <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#982B68] focus:bg-white transition-all pl-10 pr-10" />
              <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-slate-400 hover:text-slate-600">
                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full py-3.5 bg-[#982B68] hover:bg-[#822358] text-white font-semibold rounded-xl text-sm shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2 cursor-pointer">
            <span id="btn-text">Sign In to K-30_ERP</span>
            <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          </button>
        </form>

      </div>

      <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center space-y-1">
        <p class="text-xs font-semibold text-slate-700">K-30_ERP &bull; Measure DI Technologies &copy; 2026</p>
        <p class="text-[11px] text-slate-500">Developed and maintained by <span class="font-bold text-[#982B68]">Analytics Spire</span></p>
      </div>

    </div>

    <script>
      function togglePasswordVisibility() {
        var input = document.getElementById('login-password');
        if (input.type === 'password') {
          input.type = 'text';
        } else {
          input.type = 'password';
        }
      }

      function showError(msg) {
        var errDiv = document.getElementById('error-alert');
        var errText = document.getElementById('error-message');
        errText.innerText = msg;
        errDiv.classList.remove('hidden');
      }

      function hideError() {
        var errDiv = document.getElementById('error-alert');
        errDiv.classList.add('hidden');
      }

      function setLoading(loading) {
        var btnText = document.getElementById('btn-text');
        var spinner = document.getElementById('btn-spinner');
        var btn = document.getElementById('submit-btn');
        if (loading) {
          btnText.innerText = "Authenticating...";
          spinner.classList.remove('hidden');
          btn.disabled = true;
        } else {
          btnText.innerText = "Sign In to K-30_ERP";
          spinner.classList.add('hidden');
          btn.disabled = false;
        }
      }

      // Resolve a typed mobile number to the employee's registered login email.
      // Real authentication itself always happens against Firebase Auth below —
      // this only translates "mobile number" into the email Firebase Auth needs.
      async function resolveLoginEmailByMobile(digitsOnly) {
        function findIn(list) {
          return list.find(function(emp) {
            if (!emp) return false;
            var empMobileDigits = (emp.mobile || '').replace(/\D/g, '');
            return empMobileDigits && digitsOnly && empMobileDigits === digitsOnly;
          });
        }

        var employees = [];
        try {
          employees = (window.RevOpsStore && typeof window.RevOpsStore.getCollection === 'function')
            ? (window.RevOpsStore.getCollection('employees') || [])
            : [];
        } catch (e) { employees = []; }

        var match = findIn(employees);
        if (match && match.email) return match;

        if (window.db && typeof window.db.collection === 'function') {
          try {
            var snapshot = await window.db.collection('employees').get();
            var fsEmployees = [];
            snapshot.forEach(function(doc) {
              var data = doc.data() || {};
              data.docId = doc.id;
              fsEmployees.push(data);
            });
            return findIn(fsEmployees) || null;
          } catch (e) {
            return null;
          }
        }
        return null;
      }

      async function handleLoginSubmit(e) {
        e.preventDefault();
        hideError();
        setLoading(true);

        var loginInput = (document.getElementById('login-id').value || '').trim();
        var passwordInput = (document.getElementById('login-password').value || '').trim();

        if (!loginInput) {
          showError("Please enter your Mobile Number or Email.");
          setLoading(false);
          return;
        }
        if (!passwordInput) {
          showError("Please enter your password.");
          setLoading(false);
          return;
        }

        var digitsOnly = loginInput.replace(/\D/g, '');
        var isEmailInput = loginInput.indexOf('@') !== -1;

        if (!isEmailInput && digitsOnly.length < 10) {
          showError("Please enter a valid 10-digit mobile number or your email.");
          setLoading(false);
          return;
        }

        if (typeof auth === 'undefined' || !auth || typeof auth.signInWithEmailAndPassword !== 'function') {
          showError("Authentication service is not available. Please refresh and try again.");
          setLoading(false);
          return;
        }

        try {
          if (window.RevOpsStore && typeof window.RevOpsStore.initSeedData === 'function') {
            try { window.RevOpsStore.initSeedData(); } catch (errInit) {}
          }

          var loginEmail = loginInput;
          if (!isEmailInput) {
            var mobileMatch = await resolveLoginEmailByMobile(digitsOnly);
            if (!mobileMatch || !mobileMatch.email) {
              showError("This mobile number is not registered. Please contact your Admin.");
              setLoading(false);
              return;
            }
            loginEmail = mobileMatch.email;
          }

          // Real, verified sign-in — this is the only path that grants access.
          var cred = await auth.signInWithEmailAndPassword(loginEmail, passwordInput);
          var uid = cred.user.uid;

          // Resolve role/employee identity from the authoritative server-side records.
          var role = null;
          var employeeId = '';
          var isPrimaryApprover = false;
          var isDirector = false;
          var isFinanceHead = false;
          var isMasterDataAdmin = false;
          try {
            if (window.db) {
              var userDoc = await window.db.collection('users').doc(uid).get();
              if (userDoc.exists) {
                var userData = userDoc.data() || {};
                role = userData.role || role;
                employeeId = userData.employeeId || employeeId;
                isPrimaryApprover = userData.isPrimaryApprover === true;
                isDirector = userData.isDirector === true;
                isFinanceHead = userData.isFinanceHead === true;
                isMasterDataAdmin = userData.isMasterDataAdmin === true;
              }
            }
          } catch (eUserDoc) {
            console.warn("Could not load users/ role doc:", eUserDoc);
          }

          var employees = (window.RevOpsStore && typeof window.RevOpsStore.getCollection === 'function')
            ? (window.RevOpsStore.getCollection('employees') || [])
            : [];
          var employeeRecord = employees.find(function(emp) {
            return emp && (emp.uid === uid || (employeeId && emp.employeeId === employeeId) || (emp.email || '').toLowerCase() === loginEmail.toLowerCase());
          }) || null;

          if (employeeRecord && employeeRecord.isActive === false) {
            try { await auth.signOut(); } catch (eSignOut) {}
            showError("Your account has been disabled. Contact your manager or admin.");
            setLoading(false);
            return;
          }

          if (!role) role = (employeeRecord && employeeRecord.role) || 'staff';
          if (!employeeId) employeeId = (employeeRecord && (employeeRecord.employeeId || employeeRecord.id)) || uid;
          var empName = (employeeRecord && (employeeRecord.fullName || employeeRecord.name)) || cred.user.displayName || 'User';

          localStorage.setItem('userRole', role);
          localStorage.setItem('userName', empName);
          localStorage.setItem('userEmail', loginEmail);
          localStorage.setItem('employeeId', employeeId);
          // Approval authority — separate from role, assigned per-person via
          // the Employees page (see employees.html "Approval Authority").
          localStorage.setItem('isPrimaryApprover', String(isPrimaryApprover || (employeeRecord && employeeRecord.isPrimaryApprover === true)));
          localStorage.setItem('isDirector', String(isDirector || (employeeRecord && employeeRecord.isDirector === true)));
          localStorage.setItem('isFinanceHead', String(isFinanceHead || (employeeRecord && employeeRecord.isFinanceHead === true)));
          localStorage.setItem('isMasterDataAdmin', String(isMasterDataAdmin || (employeeRecord && employeeRecord.isMasterDataAdmin === true)));

          if (role === 'super_admin' || role === 'admin' || role === 'manager') {
            window.location.href = 'dashboard.html';
          } else if (role === 'staff') {
            window.location.href = 'my-scorecard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } catch (err) {
          console.error("Login error:", err);
          var code = err && err.code;
          if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') {
            showError("Incorrect password. Please try again.");
          } else if (code === 'auth/user-not-found') {
            showError("No login has been set up for this account yet. Please contact your Admin.");
          } else if (code === 'auth/too-many-requests') {
            showError("Too many failed attempts. Please wait a few minutes and try again.");
          } else if (code === 'auth/user-disabled') {
            showError("Your account has been disabled. Contact your manager or admin.");
          } else {
            showError("Sign-in failed: " + (err.message || "Please try again or contact your Admin."));
          }
          setLoading(false);
        }
      }

      function handleForgotPassword() {
        showError("Contact your Admin or Super Admin to reset your password.");
      }
    </script>
  </body>
</html>
