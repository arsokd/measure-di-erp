<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-30_ERP - Loading...</title>
    <link rel="stylesheet" href="/src/index.css">
    <script src="js/firebase-init.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/seed-data.js" defer></script>
  </head>
  <body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="text-center p-8 bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 max-w-sm w-full">
      <div class="w-12 h-12 rounded-xl bg-[#982B68] text-white flex items-center justify-center font-black text-2xl mx-auto shadow-md mb-4 animate-pulse border border-[#982B68]/40">
        K
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">K-30_ERP</h1>
      <p class="text-xs text-slate-400 mt-1 mb-6 font-medium">Enterprise Revenue Operations & ERP Platform</p>
      
      <div class="flex items-center justify-center space-x-2 text-indigo-400 text-xs font-semibold">
        <svg class="animate-spin h-4 w-4 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="uppercase tracking-wider text-[11px]">Authenticating workspace...</span>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var userRole = localStorage.getItem('userRole');
          if (userRole === 'super_admin' || userRole === 'admin' || userRole === 'manager') {
            window.location.href = 'dashboard.html';
          } else if (userRole === 'staff') {
            window.location.href = 'my-scorecard.html';
          } else {
            window.location.href = 'login.html';
          }
        }, 300);
      });
    </script>
  </body>
</html>
