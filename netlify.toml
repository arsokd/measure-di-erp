[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# firebase-admin (and its deep dependency tree: google-auth-library, gaxios,
# gcp-metadata, google-gax, protobufjs, etc.) trips a known esbuild bundling
# hazard when Netlify's function bundler tries to statically inline it - it
# can end up pulling in two different module instances of the same class
# (an ESM/CJS interop edge case), which crashes at runtime with "Class
# extends value ... is not a constructor or null" the moment the Admin SDK
# tries to use its credential. Marking it "external" tells esbuild to leave
# it untouched and just copy the real node_modules/firebase-admin folder
# into the deployed function, so Node's own require/import resolves it
# exactly as it would locally - no bundling, no interop bug.
[functions]
  node_bundler = "esbuild"
  # google-auth-library is kept external for the same reason as
  # firebase-admin above - it's the exact library that trips that
  # ESM/CJS interop bundling bug, and the Gmail-sending functions
  # depend on it directly for domain-wide-delegation impersonation.
  external_node_modules = ["firebase-admin", "google-auth-library"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "SAMEORIGIN"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"

# HTML and the app's own JS carry no version/hash in their filenames
# (unlike a typical bundled SPA build), so without this, a browser that
# already cached quotations.html or js/service-leads.js has no reason to
# ever ask the server for a newer copy - it just keeps serving the stale
# version it has, silently, with nothing in DevTools' Network tab even
# hinting a request was skipped. That's produced real confusion more than
# once: a fix verified working against the deployed files still appeared
# "not working" for a user whose browser was still running the JS from
# before that deploy. no-cache (despite the name) still caches, but
# forces a revalidation round-trip on every load - the server responds
# 304 Not Modified when nothing changed, so this costs a small request,
# not the full download, while guaranteeing every deploy takes effect on
# the very next page load instead of waiting on a manual hard-refresh.
[[headers]]
  for = "/*.html"
    [headers.values]
      Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
    [headers.values]
      Cache-Control = "no-cache"
